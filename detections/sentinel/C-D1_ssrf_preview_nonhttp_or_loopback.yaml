id: 461aead3-a4a2-5e9f-ac5f-dc7450e50e8a
name: 'C-D1 Preview request with a non-http(s) scheme or loopback/link-local target'
description: 'Flags /api/v1/preview requests whose url= scheme is present and not http/https, or whose target contains 127.0.0.1, localhost or 169.254. Backtest on this incident''s data: 203.0.113[.]87 only, 5 distinct requests (dcount); zero baseline. Tuning before go-live: decode UrlOriginal first; add private ranges, resolved addresses, 0.0.0.0, [::1] and decimal or hex IP forms. Tested on this incident''s data, not a production false-positive rate.'
severity: High  # incident severity from the report (cover, section 03); the report assigns no per-rule severity
requiredDataConnectors: []
queryFrequency: 5m
queryPeriod: 10m
triggerOperator: gt
triggerThreshold: 0
tactics:
  - InitialAccess
relevantTechniques:
  - T1190
query: |
  PortalAccessLog_CL
  | where UrlOriginal has "/api/v1/preview"
  | extend target = tostring(extract(@"url=([^&]+)", 1, UrlOriginal))
  | extend scheme = tostring(extract(@"^([a-zA-Z]+):", 1, target))
  | where (isnotempty(scheme) and scheme !in ("http", "https"))
      or target has_any ("127.0.0.1", "localhost", "169.254.")
  | summarize Requests=dcount(strcat(TimeGenerated, UrlOriginal)), Schemes=make_set(scheme),
      First=min(TimeGenerated) by SrcIpAddr
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: SrcIpAddr
version: 1.0.0
kind: Scheduled
