id: 7e1c2689-2e28-5e57-8939-722613556da4
name: 'C-D3 Local account creation, or usermod adding a privileged group'
description: 'Flags any useradd/adduser, or usermod with sudo, wheel or -aG. Backtest on this incident''s data: svc_monitor at 08:29:35 and 08:29:45 only; zero baseline. Fires on legitimate provisioning; add parent-process or same-account create-and-grant correlation. False-positive behavior on real provisioning is untested. Tested on this incident''s data, not a production false-positive rate.'
severity: High  # incident severity from the report (cover, section 03); the report assigns no per-rule severity
requiredDataConnectors: []
queryFrequency: 5m
queryPeriod: 10m
triggerOperator: gt
triggerThreshold: 0
tactics:
  - Persistence
relevantTechniques:
  - T1136
subTechniques:
  - T1136.001
query: |
  DeviceProcessEvents_CL
  | where FileName in~ ("useradd", "adduser", "usermod")
  | where FileName in~ ("useradd", "adduser") or ProcessCommandLine has_any ("sudo", "wheel", "-aG")
  | project Timestamp, DeviceName, AccountName, FileName, ProcessCommandLine, InitiatingProcessId
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: DeviceName
  - entityType: Account
    fieldMappings:
      - identifier: Name
        columnName: AccountName
  - entityType: Process
    fieldMappings:
      - identifier: CommandLine
        columnName: ProcessCommandLine
version: 1.0.0
kind: Scheduled
