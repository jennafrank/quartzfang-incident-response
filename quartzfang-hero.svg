<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-label="QUARTZFANG: SSRF to root, incident response report by Jenna Frank">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1510"/><stop offset="1" stop-color="#090c11"/></linearGradient>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="110" y1="0" x2="890" y2="0"><stop offset="0" stop-color="#b8f53a" stop-opacity=".15"/><stop offset=".5" stop-color="#b8f53a" stop-opacity=".8"/><stop offset="1" stop-color="#e2e8f0" stop-opacity=".25"/></linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b8f53a" stop-opacity="0"/><stop offset=".5" stop-color="#b8f53a" stop-opacity=".12"/><stop offset="1" stop-color="#b8f53a" stop-opacity="0"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1000" height="320" rx="10" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="999" height="319" rx="10" fill="none" stroke="#b8f53a" stroke-opacity=".25"/>
  <!-- scanning sweep -->
  <rect x="-160" y="0" width="160" height="320" fill="url(#scan)">
    <animate attributeName="x" values="-160;1000" dur="7s" repeatCount="indefinite"/>
  </rect>
  <!-- terminal line -->
  <g font-family="Menlo,Consolas,'Courier New',monospace">
    <text x="36" y="38" fill="#8fa37a" font-size="13">analyst@sentinel:~$ <tspan fill="#d6dde4">ir --case quartzfang --tlp clear</tspan></text>
    <rect x="448" y="27" width="9" height="14" fill="#b8f53a"><animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/></rect>
    <circle cx="790" cy="33" r="5" fill="#b8f53a" filter="url(#glow)"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="802" y="38" fill="#b8f53a" font-size="12" letter-spacing="1">INCIDENT · OPEN</text>
    <line x1="36" y1="54" x2="964" y2="54" stroke="#b8f53a" stroke-opacity=".12"/>
    <!-- title -->
    <text x="500" y="118" fill="#e9ffc2" font-size="54" font-weight="700" text-anchor="middle" letter-spacing="10" filter="url(#glow)">QUARTZFANG</text>
    <line x1="300" y1="134" x2="700" y2="134" stroke="#b8f53a" stroke-opacity=".5"/>
    <text x="500" y="158" fill="#c6f432" font-size="13.5" text-anchor="middle" letter-spacing="5">SSRF  →  REDIS  →  ROOT  ·  INCIDENT RESPONSE</text>
  </g>
  <!-- kill chain -->
  <g>
    <line x1="110" y1="196" x2="890" y2="196" stroke="url(#line)" stroke-width="2"/>
    <g fill="#0f1510" stroke="#b8f53a" stroke-width="2">
      <circle cx="110" cy="196" r="7"/><circle cx="240" cy="196" r="7"/><circle cx="370" cy="196" r="7"/>
      <circle cx="500" cy="196" r="7"/><circle cx="630" cy="196" r="7"/><circle cx="760" cy="196" r="7"/>
    </g>
    <circle cx="890" cy="196" r="7" fill="#0f1510" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="3 3"/>
    <!-- travelling pulse -->
    <circle r="5" cy="196" fill="#e9ffc2" filter="url(#glow)">
      <animate attributeName="cx" values="110;890" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;.05;.8;.95;1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="890" cy="196" r="7" fill="none" stroke="#e2e8f0">
      <animate attributeName="r" values="7;18" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".7;0" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <g font-family="Menlo,Consolas,monospace" font-size="10.5" fill="#8fa37a" text-anchor="middle" letter-spacing="1">
      <text x="110" y="222">SCAN</text><text x="240" y="222">SSRF</text><text x="370" y="222">CRON</text>
      <text x="500" y="222">ROOT</text><text x="630" y="222">SVC KEYS</text><text x="760" y="222">DB · REG · API</text>
      <text x="890" y="222" fill="#e2e8f0">UPLOAD ?</text>
    </g>
  </g>
  <!-- stats -->
  <g font-family="Menlo,Consolas,monospace" text-anchor="middle">
    <text x="170" y="262" fill="#c6f432" font-size="16">10 findings</text><text x="170" y="278" fill="#5e6b55" font-size="9" letter-spacing="2">STATE · SHOW · INTERPRET</text>
    <text x="390" y="262" fill="#d6dde4" font-size="16">5 detections</text><text x="390" y="278" fill="#5e6b55" font-size="9" letter-spacing="2">KQL · BACKTESTED</text>
    <text x="610" y="262" fill="#d6dde4" font-size="16">4 hosts</text><text x="610" y="278" fill="#5e6b55" font-size="9" letter-spacing="2">1 ROOTED · 3 REACHED</text>
    <text x="830" y="262" fill="#c6f432" font-size="16">97 min</text><text x="830" y="278" fill="#5e6b55" font-size="9" letter-spacing="2">OBSERVED ACTIVITY</text>
  </g>
  <line x1="36" y1="292" x2="964" y2="292" stroke="#b8f53a" stroke-opacity=".12"/>
  <g font-family="Menlo,Consolas,monospace" font-size="9.5" letter-spacing="1.5">
    <text x="36" y="309" fill="#5e6b55">IR REPORT // NIST SP 800-61r3 + SANS PICERL // MICROSOFT SENTINEL</text>
    <text x="964" y="309" fill="#8fa37a" text-anchor="end">jenna frank // 2026</text>
  </g>
</svg>
